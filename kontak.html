  <header class="page-head">
    <div class="container">
      <h1>Kontak</h1>
      <p class="text-mute mb-0">Ingin berdiskusi soal otomotif atau mengajak kerja sama? Kirim pesan di sini.</p>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="row g-5">

        <!-- Form pesan -->
        <div class="col-lg-7">
          <form action="mailto:email@anda.com" method="post" enctype="text/plain">
            <div class="mb-3">
              <label for="nama" class="form-label">Nama</label>
              <input type="text" class="form-control" id="nama" name="nama" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="pesan" class="form-label">Pesan</label>
              <textarea class="form-control" id="pesan" name="pesan" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-ink px-4">Kirim pesan</button>
          </form>
        </div>

        <!-- Info kontak -->
        <div class="col-lg-5">
          <div class="note">
            <h2 class="h5">Cara lain menghubungi saya</h2>
            <p class="mb-1">Email: Ilhamm13207@gmail.com</p>
            <p class="mb-1">Instagram: @llhammt</p>
            <p class="mb-0">WhatsApp: 082150177506</p>
          </div>
        </div>

      </div>
    </div>
