<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk | Nama Anda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <meta name="color-scheme" content="dark">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-md sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><span>N</span>ama Anda</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
        aria-controls="menu" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="proyek.html">Proyek</a></li>
          <li class="nav-item"><a class="nav-link" href="kontak.html">Kontak</a></li>
          <li class="nav-item ms-md-2"><a class="btn btn-ink btn-sm px-3 active" href="login.html">Masuk</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">

          <div class="auth-box">
            <h1 class="h3 mb-1">Masuk</h1>
            <p class="text-mute">Masuk untuk melihat halaman khusus anggota.</p>

            <div id="alertBox" class="alert d-none" role="alert"></div>

            <form id="formLogin" novalidate>
              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" autocomplete="username">
                <div class="invalid-feedback" id="emailError"></div>
              </div>

              <!-- Kata sandi -->
              <div class="mb-3">
                <label for="password" class="form-label">Kata sandi</label>
                <div class="input-group has-validation">
                  <input type="password" class="form-control" id="password" autocomplete="current-password">
                  <button class="btn btn-line" type="button" id="togglePw" aria-label="Tampilkan kata sandi">Lihat</button>
                  <div class="invalid-feedback" id="passwordError"></div>
                </div>
              </div>

              <button type="submit" class="btn btn-ink w-100 py-2">Masuk</button>
            </form>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span>&copy; 2026 Nama Anda. Dibuat dengan HTML, CSS, Bootstrap 5, dan JavaScript.</span>
      <span>Mahasiswa Teknik Otomotif</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
